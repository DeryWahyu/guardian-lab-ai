name: ML checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install core and serving dependencies
        run: python -m pip install -e "./ml[test,dev,serve]"
      - name: Lint Python and current research notebooks
        run: >-
          python -m ruff check --no-cache
          ml/src ml/tests ml/run.py scripts/research/validate_family_comparison_v9.py
          guardian_lab_url_qr_comparison_v9.ipynb guardian_lab_url_qr_recall_cnn_v10.ipynb
          guardian_lab_gold_set_indonesia.ipynb
      - name: Verify formatting
        run: >-
          python -m ruff format --check --no-cache
          ml/src ml/tests ml/run.py scripts/research/validate_family_comparison_v9.py
          guardian_lab_url_qr_comparison_v9.ipynb guardian_lab_url_qr_recall_cnn_v10.ipynb
          guardian_lab_gold_set_indonesia.ipynb
      - name: Run tests without private datasets or model binaries
        run: python -m pytest -p no:cacheprovider ml/tests -q
